<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
  <title id="title">五页演示内容骨架</title>
  <desc id="desc">从附件大纲提炼的封面、三列卡片、主视觉、图文分栏和总结页五种灰度布局</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef0f3"/>
      <stop offset="1" stop-color="#bdc2ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020817" flood-opacity=".26"/>
    </filter>
    <style>
      .page{fill:url(#panel);stroke:#697180;stroke-width:2}
      .line{fill:#8f96a1}.soft{fill:#b1b6be}.box{fill:none;stroke:#858c97;stroke-width:2;stroke-dasharray:7 6}
      .num{font:700 18px Arial,sans-serif;fill:#343a44}.label{font:700 19px 'Noto Sans SC','PingFang SC',sans-serif;fill:#343a44}
    </style>
  </defs>
  <g filter="url(#shadow)">
    <g transform="translate(18 12)">
      <rect class="page" width="564" height="126" rx="12"/>
      <text class="num" x="18" y="31">01</text><text class="label" x="58" y="31">封面页</text>
      <rect class="soft" x="186" y="23" width="192" height="10" rx="5"/>
      <rect class="line" x="112" y="50" width="340" height="20" rx="5"/>
      <rect class="soft" x="170" y="81" width="224" height="9" rx="4"/>
      <rect class="box" x="172" y="101" width="54" height="13" rx="6"/><rect class="box" x="238" y="101" width="54" height="13" rx="6"/><rect class="box" x="304" y="101" width="54" height="13" rx="6"/>
    </g>
    <g transform="translate(18 151)">
      <rect class="page" width="564" height="126" rx="12"/>
      <text class="num" x="18" y="31">02</text><text class="label" x="58" y="31">痛点与背景</text>
      <rect class="line" x="195" y="21" width="178" height="13" rx="5"/>
      <g transform="translate(62 48)"><rect class="box" width="136" height="62" rx="8"/><circle class="soft" cx="25" cy="24" r="12"/><rect class="line" x="45" y="15" width="70" height="9" rx="4"/><rect class="soft" x="45" y="34" width="63" height="6" rx="3"/></g>
      <g transform="translate(214 48)"><rect class="box" width="136" height="62" rx="8"/><circle class="soft" cx="25" cy="24" r="12"/><rect class="line" x="45" y="15" width="70" height="9" rx="4"/><rect class="soft" x="45" y="34" width="63" height="6" rx="3"/></g>
      <g transform="translate(366 48)"><rect class="box" width="136" height="62" rx="8"/><circle class="soft" cx="25" cy="24" r="12"/><rect class="line" x="45" y="15" width="70" height="9" rx="4"/><rect class="soft" x="45" y="34" width="63" height="6" rx="3"/></g>
    </g>
    <g transform="translate(18 290)">
      <rect class="page" width="564" height="126" rx="12"/>
      <text class="num" x="18" y="31">03</text><text class="label" x="58" y="31">概念 / 架构</text>
      <rect class="line" x="204" y="21" width="160" height="13" rx="5"/>
      <rect class="box" x="66" y="48" width="432" height="62" rx="8"/>
      <path class="soft" d="M84 96l48-33 36 25 43-31 55 39z"/><circle class="line" cx="435" cy="67" r="13"/>
    </g>
    <g transform="translate(18 429)">
      <rect class="page" width="564" height="126" rx="12"/>
      <text class="num" x="18" y="31">04</text><text class="label" x="58" y="31">核心机制</text>
      <rect class="line" x="209" y="21" width="150" height="13" rx="5"/>
      <rect class="box" x="62" y="48" width="202" height="62" rx="8"/><rect class="box" x="282" y="48" width="220" height="62" rx="8"/>
      <rect class="line" x="80" y="62" width="108" height="8" rx="4"/><rect class="soft" x="80" y="80" width="152" height="6" rx="3"/><rect class="soft" x="80" y="93" width="128" height="6" rx="3"/>
      <path class="soft" d="M303 96l42-31 32 23 40-27 63 35z"/>
    </g>
    <g transform="translate(18 568)">
      <rect class="page" width="564" height="126" rx="12"/>
      <text class="num" x="18" y="31">05</text><text class="label" x="58" y="31">总结与下一步</text>
      <rect class="line" x="197" y="21" width="174" height="13" rx="5"/>
      <rect class="box" x="62" y="48" width="440" height="25" rx="7"/>
      <circle class="line" cx="83" cy="91" r="7"/><rect class="soft" x="99" y="87" width="118" height="7" rx="3"/>
      <circle class="line" cx="264" cy="91" r="7"/><rect class="soft" x="280" y="87" width="118" height="7" rx="3"/>
    </g>
  </g>
</svg>
